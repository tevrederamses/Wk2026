<!DOCTYPE html>
<html lang="nl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WK 2026 Speelschema</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS ─────────────────────────────────────────── */
:root {
  --accent:  #FF6600;
  --accent2: #FF8C00;
  --nl:      #FF6600;
  --header-height: 170px;
}

[data-theme="dark"] {
  --bg:        #111215;
  --surface:   #1a1d22;
  --card:      #1f2330;
  --border:    #2a2f3e;
  --text:      #f0f2f5;
  --text2:     #c8cdd8;
  --muted:     #6b7590;
  --hdr-bg:    #111215;
  --filter-bg: #1a1d22;
  --score-col: #FF8C00;
  --big-bg:    rgba(255,102,0,0.07);
  --big-border:#FF6600;
  --live-col:  #22c55e;
}

[data-theme="light"] {
  --bg:        #fff7f0;
  --surface:   #ffffff;
  --card:      #ffffff;
  --border:    #f0d8c8;
  --text:      #1a1208;
  --text2:     #3d2e1e;
  --muted:     #a08060;
  --hdr-bg:    #FF6600;
  --filter-bg: #fff0e6;
  --score-col: #cc4400;
  --big-bg:    rgba(255,102,0,0.06);
  --big-border:#FF6600;
  --live-col:  #16a34a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background .25s, color .25s; }

/* ─── HEADER ─────────────────────────────────────────── */
header {
  background: var(--hdr-bg);
  padding: 1.5rem 1.5rem 1.25rem;
  border-bottom: 3px solid var(--accent);
  position: sticky; top: 0; z-index: 100;
  transition: background .25s;
  overflow: hidden;
}
[data-theme="dark"] header { background: linear-gradient(135deg, #111215 0%, #1a1408 80%); }

.hdr-inner { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; }
.trophy { font-size: 2rem; line-height: 1; }

header h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(2rem, 6vw, 3.6rem);
  letter-spacing: 0.06em;
  line-height: 1;
  color: #FF6600;
  text-shadow: 0 0 30px rgba(255,102,0,0.35);
}
[data-theme="light"] header h1 { color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.3); }

header p {
  font-size: 0.78rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
[data-theme="dark"] header p  { color: #a07050; }
[data-theme="light"] header p { color: rgba(255,255,255,0.8); }

.hdr-meta {
  display: flex; align-items: center; flex-wrap: wrap;
  gap: 1rem; font-size: 0.75rem; margin-top: 0.25rem;
}
[data-theme="dark"] .hdr-meta  { color: #6b7590; }
[data-theme="light"] .hdr-meta { color: rgba(255,255,255,0.75); }

.live-dot {
  display: inline-block; width: 7px; height: 7px;
  border-radius: 50%; background: var(--live-col);
  margin-right: 4px; animation: pulse 1.6s ease infinite;
}
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(1.4)} }

/* ─── LION BANNER ────────────────────────────────────── */
.lion-side {
  position: absolute; top: 0; bottom: 0;
  width: 190px; pointer-events: none; z-index: 0;
  display: flex; align-items: center; overflow: hidden;
}
.lion-side.left  { left: 0; }
.lion-side.right { right: 0; }
.lion-side img {
  height: 210%; width: auto; flex-shrink: 0; object-fit: contain;
}
.lion-side.left img {
  margin-left: -18px;
  -webkit-mask-image: linear-gradient(to right, black 30%, transparent 85%);
  mask-image: linear-gradient(to right, black 30%, transparent 85%);
}
.lion-side.right img {
  margin-right: -18px; transform: scaleX(-1);
  -webkit-mask-image: linear-gradient(to left, black 30%, transparent 85%);
  mask-image: linear-gradient(to left, black 30%, transparent 85%);
}
/* Light mode: witte leeuw op oranje achtergrond */
[data-theme="light"] .lion-side { opacity: 0.30; }
/* Dark mode: witte leeuw op donkere achtergrond — geen filter nodig */
[data-theme="dark"]  .lion-side { opacity: 0.20; }
.hdr-inner { position: relative; z-index: 1; }
@media (max-width: 600px) {
  .lion-side { width: 88px; }
  .lion-side img { height: 145%; }
}

/* THEME TOGGLE */
.theme-toggle {
  position: absolute; right: 1.25rem; top: 1.25rem; z-index: 2;
  background: none; border: 1.5px solid var(--accent);
  border-radius: 20px; padding: 0.3rem 0.75rem;
  cursor: pointer; font-size: 0.78rem; font-weight: 600;
  color: var(--accent); font-family: 'Inter', sans-serif;
  transition: background .2s, color .2s;
  display: flex; align-items: center; gap: 0.4rem;
}
.theme-toggle:hover { background: var(--accent); color: #fff; }
[data-theme="light"] .theme-toggle { border-color: rgba(255,255,255,0.7); color: #fff; }
[data-theme="light"] .theme-toggle:hover { background: rgba(255,255,255,0.25); }

/* ─── COMPACT HEADER MOBIEL ──────────────────────────── */
@media (max-width: 600px) {
  header { padding: 0.65rem 1rem 0.7rem; }
  .trophy { font-size: 1.1rem; }
  header h1 { font-size: 1.7rem; }
  header p { font-size: 0.65rem; letter-spacing: 0.04em; }
  .hdr-inner { gap: 0.15rem; }
  /* meta-items verticaal stapelen zodat countdown altijd zichtbaar is */
  .hdr-meta {
    font-size: 0.65rem; gap: 0.2rem; margin-top: 0.2rem;
    flex-direction: column; align-items: center; text-align: center;
  }
  /* "Tijden in CEST" weghalen op kleine schermen — spaart ruimte */
  .hdr-meta .hdr-tz { display: none; }
  /* Countdown prominent maken op mobiel */
  #nl-countdown { font-size: 0.75rem; font-weight: 700; }
  .theme-toggle { top: 0.6rem; right: 0.75rem; padding: 0.18rem 0.5rem; font-size: 0.7rem; }
  /* Leeuw iets kleiner zodat hij de tekst niet overlapt */
  .lion-side { width: 70px; }
  .lion-side img { height: 130%; }
}

/* ─── FILTERS ─────────────────────────────────────────── */
.filters {
  background: var(--filter-bg);
  border-bottom: 1px solid var(--border);
  padding: 0.85rem 1rem;
  display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: center;
  transition: background .25s;
  position: sticky;
  top: var(--header-height);
  z-index: 99;
}

.filter-btn {
  background: var(--card); color: var(--muted);
  border: 1.5px solid var(--border);
  padding: 0.35rem 0.85rem; border-radius: 20px;
  cursor: pointer; font-size: 0.78rem; font-weight: 500;
  font-family: 'Inter', sans-serif; transition: all .2s;
}
.filter-btn:hover { border-color: var(--accent); color: var(--accent); }
.filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 700; }

/* ─── MAIN ─────────────────────────────────────────────── */
main { max-width: 900px; margin: 0 auto; padding: 1.5rem 1rem 3rem; }

/* PHASE HEADER */
.phase-hdr {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem; letter-spacing: 0.08em;
  color: var(--accent); padding: 1.25rem 0 0.6rem;
  display: flex; align-items: center; gap: 0.75rem;
}
.phase-hdr::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(to right, var(--accent), transparent);
  opacity: 0.35;
}

/* DAY SECTION */
.day-section { margin-bottom: 1.75rem; }

.day-header {
  display: flex; align-items: center; gap: 0.6rem;
  margin-bottom: 0.6rem; padding-bottom: 0.45rem;
  border-bottom: 1px solid var(--border);
}
.day-label { font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 0.04em; color: var(--text); }
.day-date  { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; }
.day-count { margin-left: auto; font-size: 0.7rem; color: var(--muted); background: var(--card); border: 1px solid var(--border); padding: 0.18rem 0.55rem; border-radius: 10px; }

/* ─── MATCH CARD ─────────────────────────────────────── */
.match-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.7rem 1rem;
  margin-bottom: 0.45rem;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 0.5rem;
  transition: border-color .15s;
  position: relative;
}
.match-card:hover { border-color: var(--accent); }

.match-card.big {
  background: var(--big-bg);
  border-color: var(--big-border);
  border-width: 1.5px;
}
.match-card.big::before {
  content: '★'; position: absolute; top: 5px; right: 8px;
  font-size: 0.65rem; color: var(--accent); opacity: 0.75;
}
.match-card.nl-match {
  border-color: var(--accent);
  border-width: 2px;
  background: rgba(255,102,0,0.06);
}
.match-card.nl-match::before {
  content: '🇳🇱'; position: absolute; top: 5px; right: 8px;
  font-size: 0.85rem;
}

/* ─── LIVE MATCH ─────────────────────────────────────── */
.match-card.is-live {
  border-color: var(--live-col) !important;
  border-width: 2px !important;
  animation: live-pulse 2s ease-in-out infinite;
}
@keyframes live-pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(34,197,94,0); }
  50%      { box-shadow: 0 0 0 4px rgba(34,197,94,0.2); }
}
.live-badge {
  position: absolute; top: 6px; right: 8px;
  font-size: 0.62rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.06em; color: #fff;
  background: var(--live-col);
  padding: 0.1rem 0.45rem; border-radius: 8px;
  display: flex; align-items: center; gap: 3px;
}
.live-badge::before {
  content: ''; width: 5px; height: 5px; border-radius: 50%;
  background: #fff; animation: pulse 1s ease infinite;
}

/* ─── TEAMS / SCORES ────────────────────────────────── */
.team { display: flex; align-items: center; gap: 0.45rem; font-weight: 600; font-size: 0.9rem; }
.team.home { justify-content: flex-end; text-align: right; }
.team.away { justify-content: flex-start; text-align: left; }
.flag { font-size: 1.25rem; line-height: 1; flex-shrink: 0; }
.team-name { color: var(--text); }

.score-block { text-align: center; min-width: 82px; display: flex; flex-direction: column; align-items: center; gap: 1px; }
.score { font-family: 'Bebas Neue', sans-serif; font-size: 1.65rem; letter-spacing: 0.1em; line-height: 1; color: var(--score-col); }
.score-pending { font-family: 'Bebas Neue', sans-serif; font-size: 1.15rem; letter-spacing: 0.06em; color: var(--muted); }
.score-meta { font-size: 0.66rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.score-city { font-size: 0.61rem; color: var(--muted); margin-top: 1px; }
.yt-btn { display:inline-block; margin-top:4px; font-size:0.68rem; color:var(--accent); text-decoration:none; background:rgba(255,102,0,0.1); border:1px solid var(--accent); border-radius:10px; padding:0.15rem 0.5rem; white-space:nowrap; transition:background .2s; }
.yt-btn:hover { background:var(--accent); color:#fff; }

/* ─── KNOCKOUT INFO ──────────────────────────────────── */
.ko-info {
  color: var(--text2); font-size: 0.82rem; padding: 1rem 1.2rem;
  background: var(--card); border: 1px solid var(--border); border-radius: 8px;
  line-height: 1.8;
}
.ko-info strong { color: var(--text); }
.ko-info .finale { color: var(--accent); font-weight: 700; }

/* ─── KNOCKOUT BRACKET ──────────────────────────────── */
.bracket-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 0.75rem;
  margin-top: 0.5rem;
}
.bracket-round { }
.bracket-round-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 0.95rem; letter-spacing: 0.08em;
  color: var(--muted); text-transform: uppercase;
  margin-bottom: 0.4rem; padding-bottom: 0.3rem;
  border-bottom: 1px solid var(--border);
}
.bracket-match {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 6px; padding: 0.45rem 0.7rem;
  margin-bottom: 0.35rem; font-size: 0.75rem;
}
.bracket-match .bm-time { color: var(--muted); font-size: 0.65rem; margin-bottom: 0.15rem; }
.bracket-match .bm-teams { color: var(--text2); line-height: 1.5; }
.bracket-match .bm-city { color: var(--muted); font-size: 0.65rem; margin-top: 0.1rem; }
.bracket-match.final-match {
  border-color: var(--accent);
  background: var(--big-bg);
}
.bracket-match.final-match .bm-teams { color: var(--accent); font-weight: 700; }

/* ─── STANDINGS ─────────────────────────────────────── */
.standings-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
  gap: 1.25rem;
}
.standing-group {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.sg-header {
  background: var(--accent);
  color: #fff;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1rem; letter-spacing: 0.08em;
  padding: 0.45rem 0.9rem;
  display: flex; align-items: center; gap: 0.5rem;
}
.sg-table { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
.sg-table th {
  padding: 0.35rem 0.6rem; text-align: right;
  color: var(--muted); font-weight: 600; font-size: 0.67rem;
  text-transform: uppercase; letter-spacing: 0.04em;
  border-bottom: 1px solid var(--border);
}
.sg-table th:first-child { text-align: left; padding-left: 0.9rem; }
.sg-table td {
  padding: 0.45rem 0.6rem; text-align: right;
  border-bottom: 1px solid var(--border);
}
.sg-table td:first-child { text-align: left; padding-left: 0.9rem; font-weight: 600; }
.sg-table tr:last-child td { border-bottom: none; }
.sg-table tr.qualify td { background: rgba(255,102,0,0.04); }
.sg-table tr.qualify td:first-child { border-left: 3px solid var(--accent); padding-left: calc(0.9rem - 3px); }
.sg-table .pts-cell { font-weight: 700; color: var(--score-col); }
.sg-table .pos-cell { color: var(--muted); width: 20px; }
.sg-note { font-size: 0.67rem; color: var(--muted); padding: 0.4rem 0.9rem; }

/* ─── TOPSCORERS ─────────────────────────────────────── */
.scorers-table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
  max-width: 620px;
  margin: 0 auto;
}
.scorers-table {
  width: 100%; border-collapse: collapse; font-size: 0.82rem;
}
.scorers-table th {
  padding: 0.4rem 0.85rem; text-align: left;
  color: var(--muted); font-weight: 600; font-size: 0.68rem;
  text-transform: uppercase; letter-spacing: 0.04em;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.scorers-table th.num { text-align: center; width: 32px; }
.scorers-table th.goals-th { text-align: center; width: 50px; }
.scorers-table td {
  padding: 0.55rem 0.85rem;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
}
.scorers-table tr:last-child td { border-bottom: none; }
.scorers-table tr:hover td { background: rgba(255,102,0,0.03); }
.scorer-rank { text-align: center; color: var(--muted); font-size: 0.75rem; }
.scorer-rank.top3 { color: var(--accent); font-weight: 700; }
.scorer-name { font-weight: 600; color: var(--text); }
.scorer-team { font-size: 0.72rem; color: var(--muted); margin-top: 1px; }
.scorer-goals {
  text-align: center; font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem; color: var(--score-col); line-height: 1;
}
.scorer-assists { text-align: center; color: var(--muted); font-size: 0.8rem; }
.scorers-note { font-size: 0.67rem; color: var(--muted); padding: 0.5rem 0.9rem; text-align: center; border-top: 1px solid var(--border); }

/* ─── COUNTDOWN ──────────────────────────────────────── */
#nl-countdown {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.01em;
}
[data-theme="light"] #nl-countdown       { color: rgba(255,255,255,0.92); }
[data-theme="dark"]  #nl-countdown       { color: var(--accent); }
#nl-countdown.nl-live { animation: pulse 1.6s ease infinite; }
[data-theme="light"] #nl-countdown.nl-live { color: #fff; }
[data-theme="dark"]  #nl-countdown.nl-live { color: var(--accent); }

/* ─── CARDS TABLE ────────────────────────────────────── */
.cards-wrap {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; overflow: hidden;
  max-width: 620px; margin: 0 auto;
}
.cards-table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
.cards-table th {
  padding: 0.4rem 0.85rem; text-align: left;
  color: var(--muted); font-weight: 600; font-size: 0.68rem;
  text-transform: uppercase; letter-spacing: 0.04em;
  border-bottom: 1px solid var(--border); background: var(--surface);
}
.cards-table th.center { text-align: center; width: 48px; }
.cards-table td { padding: 0.55rem 0.85rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
.cards-table tr:last-child td { border-bottom: none; }
.cards-table tr:hover td { background: rgba(255,102,0,0.03); }
.card-name { font-weight: 600; color: var(--text); }
.card-team { font-size: 0.72rem; color: var(--muted); margin-top: 1px; }
.card-num { text-align: center; font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; line-height: 1; }
.card-yellow { color: #eab308; }
.card-red    { color: #ef4444; }
.cards-note { font-size: 0.67rem; color: var(--muted); padding: 0.5rem 0.9rem; text-align: center; border-top: 1px solid var(--border); }

/* No results */
.no-results { text-align: center; color: var(--muted); padding: 2.5rem; font-size: 0.85rem; }

/* Last updated */
#last-updated { text-align: center; font-size: 0.7rem; color: var(--muted); margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border); }

/* Responsive */
@media (max-width: 480px) {
  .team-name { font-size: 0.78rem; }
  .flag { font-size: 1rem; }
  .score { font-size: 1.3rem; }
  .score-block { min-width: 64px; }
  .standings-grid { grid-template-columns: 1fr; }
}
</style>
</head>

let liveData  = {};
let cardsData = {}; // keyed by player id/name

const ESPN_MAP = {
  'usa': 'united states',
  'türkiye': 'turkey',
  'turkiye': 'turkey',
  'bosnia & herzegovina': 'bosnia and herzegovina',
  "côte d'ivoire": 'ivory coast',
  'curacao': 'curaçao',
  'democratic republic of congo': 'dr congo',
  'congo': 'dr congo',
};
function normTeam(n) {
  const l = n.toLowerCase().trim();
  return ESPN_MAP[l] || l;
}

async function fetchScores() {
  let source = '';
  cardsData = {}; // reset om dubbele tellingen bij refresh te voorkomen
  try {
    const espnUrl = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?limit=200&dates=20260611-20260701';
    const r = await fetch(espnUrl);
    if (!r.ok) throw new Error('ESPN HTTP ' + r.status);
    const data = await r.json();
    (data.events || []).forEach(ev => {
      const comp = ev.competitions?.[0];
      if (!comp) return;
      const done = comp.status?.type?.completed;
      const home = comp.competitors?.find(c => c.homeAway === 'home');
      const away = comp.competitors?.find(c => c.homeAway === 'away');
      if (!home || !away) return;

      // Team ID → naam lookup voor deze wedstrijd
      const teamIdToName = {};
      if (home.team?.id) teamIdToName[home.team.id] = home.team.displayName || '';
      if (away.team?.id) teamIdToName[away.team.id] = away.team.displayName || '';

      if (done) {
        const t1 = normTeam(home.team?.displayName || '');
        const t2 = normTeam(away.team?.displayName || '');
        liveData[t1 + '|' + t2] = [parseInt(home.score ?? '0'), parseInt(away.score ?? '0')];
        liveData[t2 + '|' + t1] = [parseInt(away.score ?? '0'), parseInt(home.score ?? '0')];
      }

      // ── kaarten uit match-details (ook bij lopende wedstrijden) ──
      (comp.details || []).forEach(detail => {
        const type = (detail.type?.text || detail.type?.name || '').toLowerCase();
        const isYellow = detail.yellowCard === true || type.includes('yellow');
        const isRed    = detail.redCard === true || type.includes('red');
        if (!isYellow && !isRed) return;
        const ath = detail.athletesInvolved?.[0];
        if (!ath) return;
        const teamName = teamIdToName[detail.team?.id] || ath.team?.displayName || '';
        const key = ath.id || ath.displayName;
        if (!cardsData[key]) cardsData[key] = {
          name: ath.displayName || '?',
          team: teamName,
          yellow: 0, red: 0,
        };
        if (teamName && !cardsData[key].team) cardsData[key].team = teamName;
        if (isYellow) cardsData[key].yellow++;
        if (isRed)    cardsData[key].red++;
      });
    });
    source = 'ESPN API';
  } catch(e) {
    try {
      const r2 = await fetch('https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json');
      if (!r2.ok) throw new Error();
      const data2 = await r2.json();
      (data2.matches || []).forEach(m => {
        const t1 = (m.team1?.name || m.team1 || '').toLowerCase();
        const t2 = (m.team2?.name || m.team2 || '').toLowerCase();
        const sc = m.score?.ft || (m.score1 != null ? [m.score1, m.score2] : null);
        if (!sc) return;
        liveData[t1 + '|' + t2] = sc;
        liveData[t2 + '|' + t1] = [sc[1], sc[0]];
      });
      source = 'openfootball';
    } catch(e2) {
      // offline
      return;
    }
  }
  const now = new Date();
document.getElementById('last-updated').textContent =
    'Uitslagen via ' + source + ' · ' + now.toLocaleString('nl-NL');
}

let scorersData = [];

async function fetchTopScorers() {
  // Probeer meerdere ESPN endpoints
  const endpoints = [
    'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/leaders',
    'https://sports.core.api.espn.com/v2/sports/soccer/leagues/fifa.world/seasons/2026/types/1/leaders?limit=20',
  ];
  for (const url of endpoints) {
    try {
      const r = await fetch(url);
      if (!r.ok) continue;
      const data = await r.json();
      const goalLeaders = (data.leaders || []).find(l =>
        (l.name || '').toLowerCase().includes('goal') ||
        (l.displayName || '').toLowerCase().includes('goal') ||
        (l.abbreviation || '').toLowerCase() === 'g'
      );
      if (!goalLeaders || !goalLeaders.leaders?.length) continue;
      scorersData = goalLeaders.leaders.slice(0, 20).map((entry, i) => ({
        rank: i + 1,
        name: entry.athlete?.displayName || entry.athlete?.fullName || 'Onbekend',
        team: entry.team?.displayName || entry.team?.shortDisplayName || '',
        goals: parseInt(entry.value ?? entry.displayValue ?? '0'),
        assists: null,
        flag: flagFromCountry(entry.team?.displayName || ''),
      }));
      if (scorersData.length) return;
    } catch(e) { /* volgende proberen */ }
  }

  // Fallback: tel doelpunten uit scoreboard details
  try {
    const url2 = 'https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?limit=200&dates=20260611-20260719';
    const r2 = await fetch(url2);
    if (!r2.ok) throw new Error();
    const data2 = await r2.json();
    const playerGoals = {};
    // Bouw team ID → naam lookup
    const teamIdToName = {};
    (data2.events || []).forEach(ev => {
      const comp = ev.competitions?.[0];
      if (!comp) return;
      (comp.competitors || []).forEach(c => {
        if (c.team?.id) teamIdToName[c.team.id] = c.team.displayName || '';
      });
    });
    (data2.events || []).forEach(ev => {
      const comp = ev.competitions?.[0];
      if (!comp) return;
      (comp.details || []).forEach(detail => {
        const typeText = (detail.type?.text || detail.type?.name || '').toLowerCase();
        const typeId   = detail.type?.id || '';
        const isGoal = typeText.includes('goal') || ['70','98','137'].includes(typeId);
        if (!isGoal || typeText.includes('own') || detail.ownGoal) return;
        const ath = detail.athletesInvolved?.[0];
        if (!ath) return;
        // Haal teamnaam op via ID lookup
        const teamName = teamIdToName[detail.team?.id] || ath.team?.displayName || detail.team?.displayName || '';
        const key = ath.id || ath.displayName;
        if (!playerGoals[key]) playerGoals[key] = {
          name: ath.displayName || 'Onbekend',
          team: teamName,
          goals: 0,
          flag: flagFromCountry(teamName),
        };
        playerGoals[key].goals++;
      });
    });
    const sorted = Object.values(playerGoals).sort((a,b) => b.goals - a.goals).slice(0, 20);
    if (sorted.length) {
      scorersData = sorted.map((p, i) => ({ rank: i+1, ...p, assists: null }));
      return;
    }
  } catch(e2) { /* geen data */ }

  scorersData = [];
}

function flagFromCountry(name) {
  // Try exact match first, then partial
  if (FLAGS[name]) return FLAGS[name];
  const lower = name.toLowerCase();
  for (const [k, v] of Object.entries(FLAGS)) {
    if (k.toLowerCase() === lower) return v;
  }
  // Partial
  for (const [k, v] of Object.entries(FLAGS)) {
    if (lower.includes(k.toLowerCase()) || k.toLowerCase().includes(lower)) return v;
  }
  return '🏳️';
}

function getScore(home, away) {

function isMatchLive(m) {
  const now = Date.now();
  const [h, min] = m.time.split(':').map(Number);
  const [y, mo, d] = m.date.split('-').map(Number);
  const startUtc = Date.UTC(y, mo - 1, d, h - 2, min);
  const endUtc   = startUtc + 115 * 60 * 1000;
  return now >= startUtc && now <= endUtc;
}

function calcStandings() {
  const tables = {};
  Object.keys(GROUPS).forEach(g => {
    tables[g] = {};
    GROUPS[g].forEach(t => tables[g][t] = {played:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
  });
  MATCHES.forEach(m => {
    const sc = getScore(m.home, m.away);
    if (!Array.isArray(sc)) return;
    const [hg, ag] = [parseInt(sc[0]), parseInt(sc[1])];
    const ht = tables[m.g]?.[m.home];
    const at = tables[m.g]?.[m.away];
    if (!ht || !at) return;
    ht.played++; at.played++;
    ht.gf += hg; ht.ga += ag;
    at.gf += ag; at.ga += hg;
    if (hg > ag)      { ht.w++; at.l++; ht.pts += 3; }
    else if (hg < ag) { at.w++; ht.l++; at.pts += 3; }
    else              { ht.d++; at.d++; ht.pts += 1; at.pts += 1; }
  });
  Object.keys(tables).forEach(g => {
    tables[g] = Object.entries(tables[g])
      .sort((a,b) => {
        const [,x] = a, [,y] = b;
        const gdX = x.gf - x.ga, gdY = y.gf - y.ga;
        return (y.pts - x.pts) || (gdY - gdX) || (y.gf - x.gf) || a[0].localeCompare(b[0]);
      });
  });
  return tables;
}

function render(filter) {
  if (filter === 'standings') { renderStandings(); return; }
  if (filter === 'knockout')  { renderKnockout();  return; }
  if (filter === 'scorers')   { renderTopScorers(); return; }
  if (filter === 'cards')     { renderCards();      return; }

  const container = document.getElementById('schedule-container');
  container.innerHTML = '';
  const today = todayStr();

  let list = MATCHES.filter(m => {
    if (filter === 'nl')    return isNL(m);
    if (filter === 'big')   return isBig(m);
    if (filter === 'today') return m.date === today;
    return true;
  });

  const seen = new Set();
  list = list.filter(m => {
    const k = m.date + m.home + m.away;
    if (seen.has(k)) return false;
    seen.add(k); return true;
  });

  if (filter === 'today' && !list.length) {
    container.innerHTML = '<div class="no-results">Geen wedstrijden vandaag. Kies een andere filter.</div>';
    return;
  }

  const ph = document.createElement('div');
  ph.className = 'phase-hdr';
  ph.textContent = '⚽ Groepsfase';
  container.appendChild(ph);

  const byDate = {};
  list.forEach(m => { (byDate[m.date] = byDate[m.date] || []).push(m); });

  Object.keys(byDate).sort().forEach(date => {
    const matches = byDate[date];
    const sec = document.createElement('div');
    sec.className = 'day-section';
    const isToday = date === today;
    sec.innerHTML = '<div class="day-header"><span class="day-label">' + (isToday ? '📍 ' : '') + fmtDate(date) + '</span><span class="day-date">' + date.slice(8,10) + '.' + date.slice(5,7) + '</span><span class="day-count">' + matches.length + ' wedstrijd' + (matches.length > 1 ? 'en' : '') + '</span></div>';

    matches.forEach(m => {
      const sc = getScore(m.home, m.away);
      const hasScore = Array.isArray(sc);
      const live = isMatchLive(m);
      const nl   = isNL(m);
      const big  = !nl && isBig(m);

      const card = document.createElement('div');
      let cls = 'match-card';
      if (live) cls += ' is-live';
      else if (nl) cls += ' nl-match';
      else if (big) cls += ' big';
      card.className = cls;

      const isPast = m.date < today || (m.date === today && hasScore);
      const ytQuery = encodeURIComponent('NOS samenvatting ' + m.home + ' ' + m.away + ' WK 2026');
      const ytBtn = isPast && !live
        ? '<a class="yt-btn" href="https://www.youtube.com/results?search_query=' + ytQuery + '" target="_blank" rel="noopener">📺 Samenvatting</a>'
        : '';

      const liveBadge = live ? '<div class="live-badge">Live</div>' : '';

      const scoreHtml = hasScore
        ? '<span class="score">' + sc[0] + '&nbsp;–&nbsp;' + sc[1] + '</span><span class="score-meta">Eindstand</span>'
        : live
          ? '<span class="score" style="color:var(--live-col)">LIVE</span><span class="score-meta">Poule ' + m.g + '</span>'
          : '<span class="score-pending">' + m.time + '</span><span class="score-meta">Poule ' + m.g + '</span>';

      card.innerHTML =
        liveBadge +
        '<div class="team home"><span class="team-name">' + m.home + '</span><span class="flag">' + flag(m.home) + '</span></div>' +
        '<div class="score-block">' + scoreHtml + '<span class="score-city">' + m.city + '</span>' + ytBtn + '</div>' +
        '<div class="team away"><span class="flag">' + flag(m.away) + '</span><span class="team-name">' + m.away + '</span></div>';

      sec.appendChild(card);
    });
    container.appendChild(sec);
  });

  if (filter === 'all' || filter === 'group') {
    const ph2 = document.createElement('div');
    ph2.className = 'phase-hdr';
    ph2.textContent = '⚡ Knock-out Fase';
    container.appendChild(ph2);
    const box = document.createElement('div');
    box.className = 'ko-info';
    box.innerHTML = '<strong>Ronde van 32</strong> — 28 juni t/m 3 juli 2026<br><strong>Achtste finales</strong> — 4 t/m 7 juli 2026<br><strong>Kwartfinales</strong> — 9 t/m 12 juli 2026<br><strong>Halve finales</strong> — 14 &amp; 15 juli 2026<br><span class="finale">🏆 FINALE — 19 juli 2026 · MetLife Stadium, New York · 21:00</span><br><span style="font-size:.75rem;color:var(--muted);display:block;margin-top:.5rem">Bekijk het volledige schema via de Knock-out filter ↑</span>';
    container.appendChild(box);
  }
}

// ─── COUNTDOWN ───────────────────────────────────────
function getNextNLMatch() {
  const now = Date.now();
  return MATCHES
    .filter(m => NL.has(m.home) || NL.has(m.away))
    .find(m => {
      const [h, min] = m.time.split(':').map(Number);
      const [y, mo, d] = m.date.split('-').map(Number);
      return Date.UTC(y, mo - 1, d, h - 2, min) > now;
    }) || null;
}

function startCountdown() {
  function update() {
    const el = document.getElementById('nl-countdown');
    if (!el) return;

    // Check of NL nu live speelt
    const live = MATCHES.find(m => (NL.has(m.home) || NL.has(m.away)) && isMatchLive(m));
    if (live) {
      const opp = NL.has(live.home) ? live.away : live.home;
      el.textContent = '🇳🇱 vs ' + flag(opp) + ' LIVE NU! ⚽';
      el.className = 'nl-live';
      return;
    }
    el.classList.remove('nl-live');

    const m = getNextNLMatch();
    if (!m) { el.textContent = ''; return; }

    const [h, min] = m.time.split(':').map(Number);
    const [y, mo, d] = m.date.split('-').map(Number);
    const diff = Date.UTC(y, mo - 1, d, h - 2, min) - Date.now();
    if (diff <= 0) { el.textContent = ''; return; }

    const days  = Math.floor(diff / 86400000);
    const hours = Math.floor((diff % 86400000) / 3600000);
    const mins  = Math.floor((diff % 3600000) / 60000);
    const secs  = Math.floor((diff % 60000) / 1000);
    const opp   = NL.has(m.home) ? m.away : m.home;
    const pad   = n => String(n).padStart(2, '0');

    el.textContent = '🇳🇱 vs ' + flag(opp) + ' ' + opp + ' over ' +
      (days > 0 ? days + 'd ' : '') +
      pad(hours) + ':' + pad(mins) + ':' + pad(secs);
  }
  update();
  setInterval(update, 1000);
}

function renderCards() {
  const container = document.getElementById('schedule-container');
  container.innerHTML = '';

  const ph = document.createElement('div');
  ph.className = 'phase-hdr';
  ph.textContent = '🟨 Kaarten';
  container.appendChild(ph);

  const sorted = Object.values(cardsData)
    .filter(p => p.yellow + p.red > 0)
    .sort((a, b) => (b.red * 3 + b.yellow) - (a.red * 3 + a.yellow));

  if (!sorted.length) {
    const msg = document.createElement('div');
    msg.className = 'no-results';
    msg.textContent = 'Nog geen kaartdata beschikbaar — kaarten worden zichtbaar zodra wedstrijden zijn gespeeld.';
    container.appendChild(msg);
    return;
  }

  const wrap  = document.createElement('div');
  wrap.className = 'cards-wrap';
  const table = document.createElement('table');
  table.className = 'cards-table';
  table.innerHTML =
    '<thead><tr>' +
    '<th>#</th><th>Speler</th>' +
    '<th class="center">🟨</th>' +
    '<th class="center">🟥</th>' +
    '</tr></thead>';
  const tbody = document.createElement('tbody');
  sorted.forEach((p, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td style="color:var(--muted);font-size:.75rem;text-align:center">' + (i + 1) + '</td>' +
      '<td><div class="card-name">' + flagFromCountry(p.team) + ' ' + p.name + '</div>' +
         '<div class="card-team">' + p.team + '</div></td>' +
      '<td class="card-num card-yellow">' + (p.yellow || '—') + '</td>' +
      '<td class="card-num card-red">'    + (p.red    || '—') + '</td>';
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  wrap.appendChild(table);
  const note = document.createElement('div');
  note.className = 'cards-note';
  note.textContent = 'Via ESPN · gesorteerd op impact (rood telt 3×)';
  wrap.appendChild(note);
  container.appendChild(wrap);
}

document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('[data-filter]');
  if (!btn) return;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.filter;
  render(activeFilter);
});

(async () => {
  await Promise.all([fetchScores(), fetchTopScorers()]);
  startCountdown();
  render('all');
  const today = todayStr();
  setTimeout(() => {
    const d = today.slice(8,10) + '.' + today.slice(5,7);
    const sections = document.querySelectorAll('.day-section');
    for (const sec of sections) {
      if ((sec.querySelector('.day-date')?.textContent || '') === d) {
        const headerH = document.querySelector('header').offsetHeight;
        const filterH = document.getElementById('filters').offsetHeight;
        const offset  = headerH + filterH + 12;
        const top = sec.getBoundingClientRect().top + window.scrollY - offset;
        window.scrollTo({ top, behavior: 'smooth' });
        break;
      }
    }
  }, 600);
  setInterval(async () => {
    await Promise.all([fetchScores(), fetchTopScorers()]);
    render(activeFilter);
  }, 5 * 60 * 1000);
})();
